[package]
name = "drove"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Versioned, declarative agent workspaces"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/radiator-engineering/Drove"
homepage = "https://github.com/radiator-engineering/Drove"
keywords = ["cli", "workspace", "declarative", "herdr", "devtools"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "src/**",
    "tests/**",
    "examples/**",
    "docs/*.md",
    "README.md",
    "LICENSE",
]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
pkg-fmt = "txz"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
hex = "0.4.3"
interprocess = "2.4.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
starlark = "0.14.2"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
