name: Release builds

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write # create the release and upload assets to the tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: drove-linux-x86_64
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: drove-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: drove-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: drove-windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/drove"
          archive="${{ matrix.artifact }}.tar.gz"
          tar -czf "$archive" -C "$(dirname "$bin")" drove
          shasum -a 256 "$archive" > "$archive.sha256"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/drove.exe"
          archive="${{ matrix.artifact }}.zip"
          7z a "$archive" "$bin"
          certutil -hashfile "$archive" SHA256 | sed -n '2p' | tr -d '\r' | awk -v f="$archive" '{print $1"  "f}' > "$archive.sha256"

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.tar.gz.sha256
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.zip.sha256
          fail_on_unmatched_files: false
