name: Release builds

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: target/x86_64-unknown-linux-gnu/release/drove
            artifact: drove-linux-x86_64
          - os: macos-13
            target: x86_64-apple-darwin
            binary: target/x86_64-apple-darwin/release/drove
            artifact: drove-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: target/aarch64-apple-darwin/release/drove
            artifact: drove-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: target/x86_64-pc-windows-msvc/release/drove.exe
            artifact: drove-windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
